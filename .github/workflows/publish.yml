name: Publish

on:
  push:
    branches: [master]
  workflow_dispatch:

# Deploying pushes the built site to the gh-pages branch with the built-in token.
permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the graph as a static site
        uses: logseq/publish-spa@main

      - name: Add a .nojekyll file
        run: touch www/.nojekyll

      - name: Deploy to gh-pages
        uses: JamesIves/github-pages-deploy-action@v4.8.0
        with:
          branch: gh-pages
          folder: www
          clean: true
          single-commit: true
